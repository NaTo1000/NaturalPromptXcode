# Example Secret manifest. DO NOT commit real credentials.
# Create the real secret out-of-band, e.g.:
#
#   kubectl -n naturalpromptxcode create secret generic npx-secrets \
#       --from-literal=OPENAI_API_KEY="sk-..." \
#       --from-literal=ANTHROPIC_API_KEY=""
#
# or use a SealedSecret / ExternalSecret in production.
apiVersion: v1
kind: Secret
metadata:
  name: npx-secrets
  namespace: naturalpromptxcode
  labels:
    app.kubernetes.io/name: naturalpromptxcode
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  OPENAI_API_KEY: "replace-me"
  ANTHROPIC_API_KEY: ""
