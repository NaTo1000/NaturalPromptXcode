# Long-running Deployment that keeps a NaturalPromptXcode container available
# for interactive code generation via `kubectl exec`. The application is a CLI
# (not a network server), so the container is kept alive with a sleep loop and
# users run the `naturalpromptxcode` command on demand.
#
# Example:
#   kubectl -n naturalpromptxcode exec -it deploy/naturalpromptxcode -- \
#       naturalpromptxcode generate "A todo list app" --output /data/output
apiVersion: apps/v1
kind: Deployment
metadata:
  name: naturalpromptxcode
  namespace: naturalpromptxcode
  labels:
    app.kubernetes.io/name: naturalpromptxcode
    app.kubernetes.io/component: cli
spec:
  replicas: 1
  strategy:
    type: Recreate           # single writer on the PVC
  selector:
    matchLabels:
      app.kubernetes.io/name: naturalpromptxcode
      app.kubernetes.io/component: cli
  template:
    metadata:
      labels:
        app.kubernetes.io/name: naturalpromptxcode
        app.kubernetes.io/component: cli
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: npx
          image: naturalpromptxcode:latest
          imagePullPolicy: IfNotPresent
          # Override the default CLI entrypoint so the pod stays running and
          # users can `kubectl exec` into it to invoke the tool.
          command: ["/bin/sh", "-c"]
          args: ["trap 'exit 0' TERM; while :; do sleep 3600 & wait $!; done"]
          env:
            - name: NPX_CONFIG
              value: /etc/naturalpromptxcode/config.yaml
            - name: NPX_OUTPUT_DIR
              value: /data/output
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: npx-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: npx-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/naturalpromptxcode
              readOnly: true
            - name: output
              mountPath: /data/output
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            exec:
              command: ["python", "-c", "import src.main"]
            initialDelaySeconds: 15
            periodSeconds: 60
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command: ["python", "-c", "import src.main"]
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
        - name: config
          configMap:
            name: npx-config
        - name: output
          persistentVolumeClaim:
            claimName: npx-output
        - name: tmp
          emptyDir: {}
