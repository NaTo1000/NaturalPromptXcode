apiVersion: v1
kind: ConfigMap
metadata:
  name: npx-config
  namespace: naturalpromptxcode
  labels:
    app.kubernetes.io/name: naturalpromptxcode
    app.kubernetes.io/component: config
data:
  # Mounted into the container at /etc/naturalpromptxcode/config.yaml.
  # Adjust to match your environment; do not put secrets here.
  config.yaml: |
    model:
      provider: "openai"
      name: "gpt-4"
      temperature: 0.7
      max_tokens: 2000
      api_key_env: "OPENAI_API_KEY"
      timeout: 30
      max_retries: 3
    build:
      default_framework: "swiftui"
      default_language: "swift"
      target_ios_version: "15.0"
    output:
      default_dir: "/data/output"
      clean_before_build: false
      preserve_metadata: true
